name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux USB dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Verify tagged version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "infishark-cli"))')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p infishark-cli --target ${{ matrix.target }}

      - name: Check release commands
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/infishark"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" ctf --help
          "$binary" ctf account --help
          "$binary" ctf start --help
          "$binary" ctf load --help
          "$binary" ctf submit --help

      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "infishark-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" infishark

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/infishark.exe" -DestinationPath "infishark-${{ matrix.target }}.zip"

      - name: Retain verified platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: infishark-${{ matrix.target }}
          path: infishark-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: infishark-*
          merge-multiple: true
          path: artifacts

      - name: Verify complete platform set and record hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('artifacts')
          expected={
              'infishark-x86_64-unknown-linux-gnu.tar.gz',
              'infishark-aarch64-unknown-linux-gnu.tar.gz',
              'infishark-x86_64-apple-darwin.tar.gz',
              'infishark-aarch64-apple-darwin.tar.gz',
              'infishark-x86_64-pc-windows-msvc.zip',
          }
          assert {p.name for p in root.iterdir()}==expected
          hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in sorted(expected)}
          (root/'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name,digest in hashes.items()))
          (root/'release-provenance.json').write_text(json.dumps({'tag':os.environ['GITHUB_REF_NAME'],'commit':os.environ['GITHUB_SHA'],'artifacts':hashes},indent=2)+'\n')
          PY

      - name: Upload draft, then publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --latest=false --title "InfiShark $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
